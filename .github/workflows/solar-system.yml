name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}  
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}

jobs:
    unit-testing:
        name: Unit Testing   
        services:
          mongo-db:
            image: siddhartha67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
            MONGO_URI: mongodb://localhost:27017/superData
            MONGO_USERNAME: non-prod-user   
            MONGO_PASSWORD: non-prod-password
        strategy:
          matrix:
            nodejs_verison: [18,19,20]
            operating_system: [ubuntu-latest]
            exclude: 
              - nodejs_verison: 18
                operating_system: ubuntu-latest
        runs-on: ${{matrix.operating_system}}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{matrix.nodejs_verison}}
          uses: actions/setup-node@v4
          with:
            node-version: 20
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml


    code-coverage:
        name: Code Coverage
        runs-on: ubuntubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install
    
        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage
          
        - name: Archive Coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: COde-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing,code-coverage]
        permissions: 
          packages: write
        runs-on: ubuntu-latest     
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4 

        - name: DockerHub Login
          uses: docker/login-action@v2.2.0
          with:
            username: ${{vars.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_PASSWORD}} 
        
        - name: GHCR Login
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}} 

        - name: DockerHub Build
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

        - name: DockerHub Image Testing
          run: |
            docker images
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

              export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
              echo $IP

              echo Testing Image URL using wget 
              wget -q -O - 127.0.0.1:3000/live | grep live
              wget -q -O - http://$IP:3000/live | grep live

        - name: Container Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}  
              ghcr.io/${{github.repository_owner}}/solar-system:${{github.sha}}   





